
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화 탐방 지도</title>

    <style>
        /* 모든 요소의 크기 계산 방식을 통일합니다. */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 나눕니다. */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 패널 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            padding: 22px;
            background: #fff;
            border-right: 1px solid #ddd;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            margin: 0 0 16px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 탭 버튼 두 개를 나란히 배치합니다. */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 6px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f5f5f5;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-button.active {
            background: #fee500;
            border-color: #e5ce00;
        }

        /* 현재 위치 버튼 */
        #locationButton {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        #locationButton:hover {
            background: #f7f7f7;
        }

        /* 상태 안내 문구 */
        #status {
            margin-bottom: 10px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 검색 결과 목록 */
        #resultList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .place-item {
            padding: 13px 8px;
            border-bottom: 1px solid #eee;
            border-radius: 6px;
            cursor: pointer;
        }

        .place-item:hover,
        .place-item.selected {
            background: #fffbea;
        }

        .place-name {
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-address {
            color: #555;
            font-size: 12px;
            line-height: 1.6;
        }

        .place-category {
            margin-top: 5px;
            color: #888;
            font-size: 11px;
        }

        /* 이전 페이지와 다음 페이지 버튼 */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-top: 12px;
        }

        .page-button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        .page-button:disabled {
            color: #aaa;
            background: #f5f5f5;
            cursor: not-allowed;
        }

        #pageInfo {
            font-size: 12px;
            color: #555;
        }

        /* 오른쪽 지도 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #eee;
        }

        /* 모바일 화면에서는 위아래로 배치합니다. */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 50%;
                min-height: 300px;
                padding: 14px;
            }

            h1 {
                font-size: 20px;
            }

            #map {
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 카테고리 탭과 검색 결과 -->
        <aside class="sidebar">
            <h1>📍 문화 탐방 지도</h1>

            <p class="description">
                내 주변의 문화 공간과 공연장을 찾아보세요.
            </p>

            <!-- CT1 탭과 공연장 검색 탭 -->
            <div class="tab-container">
                <button
                    id="cultureTab"
                    class="tab-button active"
                    type="button"
                    aria-pressed="true"
                >
                    문화 시설
                </button>

                <button
                    id="performanceTab"
                    class="tab-button"
                    type="button"
                    aria-pressed="false"
                >
                    공연장
                </button>
            </div>

            <!-- 현재 위치를 다시 확인하는 버튼 -->
            <button id="locationButton" type="button">
                📍 현재 위치로 이동
            </button>

            <div id="status" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </div>

            <!-- 검색 결과가 여기에 표시됩니다. -->
            <div id="resultList"></div>

            <!-- 검색 결과 페이지 이동 -->
            <div class="pagination">
                <button
                    id="prevButton"
                    class="page-button"
                    type="button"
                    disabled
                >
                    이전
                </button>

                <span id="pageInfo">1 페이지</span>

                <button
                    id="nextButton"
                    class="page-button"
                    type="button"
                    disabled
                >
                    다음
                </button>
            </div>
        </aside>

        <!-- 오른쪽: 카카오 지도 -->
        <main id="map" aria-label="문화 탐방 지도"></main>
    </div>

    <!-- 카카오 지도 SDK와 장소 검색 라이브러리 -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0156c394d790a54991f25ec6156f1d8f&libraries=services&autoload=false"
        onerror="document.getElementById('status').textContent='지도 SDK를 불러오지 못했습니다. 키와 도메인을 확인하세요.'"
    ></script>

    <script>
        // 지도와 장소 검색에 사용할 변수
        let map = null;
        let places = null;
        let infoWindow = null;

        let currentPosition = null;
        let currentMarker = null;
        let placeMarkers = [];

        // 현재 선택된 탭
        let currentTab = "CT1";

        // 검색 결과 페이지 정보
        let currentPagination = null;
        let currentPage = 1;

        // 검색 요청 순서를 기록해 이전 요청의 결과가 덮어쓰지 않도록 합니다.
        let searchRequestId = 0;

        // 지도 준비 상태
        let isMapReady = false;

        // HTML 요소 가져오기
        const cultureTab = document.getElementById("cultureTab");
        const performanceTab = document.getElementById("performanceTab");
        const locationButton = document.getElementById("locationButton");
        const statusElement = document.getElementById("status");
        const resultList = document.getElementById("resultList");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const pageInfo = document.getElementById("pageInfo");

        // 상태 안내 문구 변경
        function setStatus(message) {
            statusElement.textContent = message;
        }

        // 페이지 이동 버튼의 상태 갱신
        function updatePagination() {
            if (!currentPagination) {
                prevButton.disabled = true;
                nextButton.disabled = true;
                pageInfo.textContent = "1 페이지";
                return;
            }

            currentPage = currentPagination.current;

            prevButton.disabled = !currentPagination.hasPrevPage;
            nextButton.disabled = !currentPagination.hasNextPage;

            pageInfo.textContent = currentPage + " 페이지";
        }

        // 페이지 이동 버튼을 초기 상태로 변경
        function resetPagination() {
            currentPagination = null;
            currentPage = 1;

            prevButton.disabled = true;
            nextButton.disabled = true;
            pageInfo.textContent = "1 페이지";
        }

        // 기존 검색 결과와 마커를 제거
        function clearResults() {
            resultList.replaceChildren();

            placeMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            placeMarkers = [];

            if (infoWindow) {
                infoWindow.close();
            }

            resetPagination();
        }

        // 현재 탭의 선택 상태를 화면에 반영
        function updateTabs() {
            const isCulture = currentTab === "CT1";

            cultureTab.classList.toggle("active", isCulture);
            performanceTab.classList.toggle("active", !isCulture);

            cultureTab.setAttribute("aria-pressed", String(isCulture));
            performanceTab.setAttribute("aria-pressed", String(!isCulture));
        }

        // 카카오 지도 SDK가 준비된 뒤 초기화
        function loadKakaoMap() {
            if (!window.kakao || !window.kakao.maps) {
                setStatus(
                    "SDK를 불러오지 못했습니다. JavaScript 키와 등록 도메인을 확인하세요."
                );
                return;
            }

            kakao.maps.load(function () {
                initializeMap();
            });
        }

        // 지도 생성 및 현재 위치 확인
        function initializeMap() {
            // 현재 위치를 확인하지 못했을 때 사용할 기본 위치: 서울 시청
            const defaultPosition = new kakao.maps.LatLng(
                37.5665,
                126.9780
            );

            // 확대 레벨 5로 지도 생성
            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultPosition,
                    level: 5
                }
            );

            // 장소 검색과 정보창 생성
            places = new kakao.maps.services.Places();

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 10
            });

            isMapReady = true;
            setStatus("현재 위치를 확인하고 있습니다.");

            // 브라우저가 위치 정보를 지원하는지 확인
            if (!navigator.geolocation) {
                currentPosition = defaultPosition;
                setStatus("위치 기능을 지원하지 않아 기본 위치에서 검색합니다.");
                searchPlaces();
                return;
            }

            // 브라우저에 현재 위치 요청
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도 저장
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    // 지도를 현재 위치로 이동
                    map.setCenter(currentPosition);

                    // 현재 위치 마커 생성
                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: "현재 위치"
                    });

                    setStatus("현재 위치를 찾았습니다. 주변 장소를 검색합니다.");

                    // 위치 확인이 끝나면 선택된 탭 검색
                    searchPlaces();
                },
                function (error) {
                    // 위치를 가져오지 못하면 서울 시청을 기본 위치로 사용
                    currentPosition = defaultPosition;

                    if (error.code === error.PERMISSION_DENIED) {
                        setStatus("위치 권한이 거부되어 기본 위치에서 검색합니다.");
                    } else if (error.code === error.TIMEOUT) {
                        setStatus("위치 확인 시간이 초과되어 기본 위치에서 검색합니다.");
                    } else {
                        setStatus("현재 위치를 확인하지 못해 기본 위치에서 검색합니다.");
                    }

                    searchPlaces();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 현재 위치를 다시 확인
        function refreshCurrentLocation() {
            if (!isMapReady) {
                setStatus("지도가 아직 준비되지 않았습니다.");
                return;
            }

            if (!navigator.geolocation) {
                setStatus("이 브라우저는 위치 기능을 지원하지 않습니다.");
                return;
            }

            setStatus("현재 위치를 다시 확인하고 있습니다.");

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 새로운 현재 위치 저장
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    // 기존 현재 위치 마커 제거
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    // 새로운 현재 위치 마커 표시
                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: "현재 위치"
                    });

                    // 지도 중심을 현재 위치로 이동
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    setStatus("현재 위치를 갱신했습니다.");

                    // 새로운 위치를 기준으로 장소 검색
                    searchPlaces();
                },
                function (error) {
                    if (error.code === error.PERMISSION_DENIED) {
                        setStatus("위치 권한이 거부되었습니다. 브라우저 설정을 확인하세요.");
                    } else {
                        setStatus("현재 위치를 가져오지 못했습니다.");
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 선택한 장소의 이름과 주소를 정보창에 표시
        function showPlaceInfo(place, marker) {
            const content = document.createElement("div");

            content.style.cssText =
                "padding:12px;max-width:250px;line-height:1.6;" +
                "font-size:12px;overflow-wrap:anywhere;";

            const name = document.createElement("strong");
            name.textContent = place.place_name;

            const address = document.createElement("div");
            address.style.marginTop = "5px";
            address.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            content.append(name, address);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // 지도에 장소 마커 생성
        function createPlaceMarker(place) {
            const position = new kakao.maps.LatLng(
                Number(place.y),
                Number(place.x)
            );

            const marker = new kakao.maps.Marker({
                map: map,
                position: position,
                title: place.place_name
            });

            // 마커를 클릭하면 장소 이름과 주소 표시
            kakao.maps.event.addListener(marker, "click", function () {
                showPlaceInfo(place, marker);
                highlightPlace(place.id);
            });

            placeMarkers.push(marker);

            return marker;
        }

        // 선택한 장소의 목록을 강조
        function highlightPlace(placeId) {
            const items = resultList.querySelectorAll(".place-item");

            items.forEach(function (item) {
                item.classList.toggle(
                    "selected",
                    item.dataset.placeId === String(placeId)
                );
            });
        }

        // 검색 결과를 목록과 지도에 표시
        function displayPlaces(data, pagination) {
            // 기존 마커와 목록 제거
            clearResults();

            currentPagination = pagination;
            updatePagination();

            if (!data || data.length === 0) {
                setStatus("검색 결과가 없습니다.");
                return;
            }

            setStatus(
                "검색 결과 " + data.length + "개를 표시하고 있습니다."
            );

            // 검색 결과를 하나씩 화면에 표시
            data.forEach(function (place) {
                const item = document.createElement("div");
                item.className = "place-item";
                item.dataset.placeId = String(place.id);

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = place.place_name;

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                const category = document.createElement("div");
                category.className = "place-category";
                category.textContent =
                    place.category_name || "분류 정보 없음";

                item.append(name, address, category);

                // 목록을 클릭하면 해당 장소로 지도 이동
                item.addEventListener("click", function () {
                    const position = new kakao.maps.LatLng(
                        Number(place.y),
                        Number(place.x)
                    );

                    map.setCenter(position);
                    map.setLevel(3);

                    // 현재 페이지의 마커 중 해당 장소 찾기
                    const markerIndex = data.indexOf(place);
                    const marker = placeMarkers[markerIndex];

                    if (marker) {
                        showPlaceInfo(place, marker);
                    }

                    highlightPlace(place.id);
                });

                resultList.appendChild(item);

                // 각 장소에 지도 마커 생성
                createPlaceMarker(place);
            });

            // 현재 페이지의 검색 결과가 보이도록 지도 범위 조정
            const bounds = new kakao.maps.LatLngBounds();

            data.forEach(function (place) {
                bounds.extend(
                    new kakao.maps.LatLng(
                        Number(place.y),
                        Number(place.x)
                    )
                );
            });

            map.setBounds(bounds);
        }

        // 현재 선택된 탭의 장소를 검색
        function searchPlaces() {
            if (!isMapReady || !places || !currentPosition) {
                return;
            }

            // 이전 검색 요청을 무효화하고 새 요청 번호 생성
            const requestId = ++searchRequestId;

            clearResults();

            setStatus("주변 장소를 검색하고 있습니다...");

            // 현재 위치를 기준으로 반경 5km 이내를 검색
            const searchOptions = {
                location: currentPosition,
                radius: 5000,
                sort: kakao.maps.services.SortBy.DISTANCE,
                size: 15,
                page: 1
            };

            // 검색 결과 콜백
            function handleSearchResult(data, status, pagination) {
                // 더 최근에 시작한 검색이 있다면 이전 결과는 무시
                if (requestId !== searchRequestId) {
                    return;
                }

                if (status === kakao.maps.services.Status.OK) {
                    displayPlaces(data, pagination);
                } else if (
                    status === kakao.maps.services.Status.ZERO_RESULT
                ) {
                    clearResults();
                    setStatus("주변에 검색된 장소가 없습니다.");
                } else {
                    clearResults();
                    setStatus("검색 중 오류가 발생했습니다. 다시 시도해 주세요.");
                }
            }

            // CT1 탭은 카테고리 검색, 공연장 탭은 키워드 검색
            if (currentTab === "CT1") {
                places.categorySearch(
                    "CT1",
                    handleSearchResult,
                    searchOptions
                );
            } else {
                places.keywordSearch(
                    "공연장",
                    handleSearchResult,
                    searchOptions
                );
            }
        }

        // 이전 페이지로 이동
        function goToPreviousPage() {
            if (
                currentPagination &&
                currentPagination.hasPrevPage
            ) {
                currentPagination.prevPage();
            }
        }

        // 다음 페이지로 이동
        function goToNextPage() {
            if (
                currentPagination &&
                currentPagination.hasNextPage
            ) {
                currentPagination.nextPage();
            }
        }

        // 문화 시설 탭 선택
        cultureTab.addEventListener("click", function () {
            currentTab = "CT1";
            updateTabs();

            if (isMapReady) {
                searchPlaces();
            }
        });

        // 공연장 탭 선택
        performanceTab.addEventListener("click", function () {
            currentTab = "PERFORMANCE";
            updateTabs();

            if (isMapReady) {
                searchPlaces();
            }
        });

        // 현재 위치 버튼 클릭
        locationButton.addEventListener(
            "click",
            refreshCurrentLocation
        );

        // 페이지 이동 버튼 연결
        prevButton.addEventListener("click", goToPreviousPage);
        nextButton.addEventListener("click", goToNextPage);

        // SDK가 준비된 뒤 지도 초기화
        loadKakaoMap();
    </script>
</body>
</html>
