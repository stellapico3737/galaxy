
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화 탐방 지도</title>

    <!-- 카카오맵 SDK와 장소 검색 서비스 불러오기 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0156c394d790a54991f25ec6156f1d8f&libraries=services&autoload=false"></script>

    <style>
        /* 전체 요소의 크기 계산 방식 통일 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽 검색 영역과 오른쪽 지도 영역으로 분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background-color: white;
        }

        /* 제목 영역 */
        .header {
            padding: 20px;
            color: white;
            background-color: #245bdb;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .header p {
            margin: 0;
            font-size: 13px;
        }

        /* 탭 버튼 영역 */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 6px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        .tab-button.active {
            color: white;
            background-color: #245bdb;
            border-color: #245bdb;
            font-weight: bold;
        }

        /* 현재 위치 버튼 */
        .location-area {
            padding: 0 12px 12px;
        }

        #locationButton {
            width: 100%;
            padding: 11px;
            border: 1px solid #245bdb;
            border-radius: 8px;
            background: white;
            color: #245bdb;
            font-weight: bold;
            cursor: pointer;
        }

        /* 검색 결과 제목 */
        .result-header {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            font-weight: bold;
        }

        /* 검색 결과 목록 */
        #placeList {
            flex: 1;
            overflow-y: auto;
        }

        .place-item {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover {
            background-color: #f3f6ff;
        }

        .place-name {
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-address {
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }

        .message {
            padding: 20px 16px;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }

        /* 페이지 이동 영역 */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 8px;
            border-top: 1px solid #eee;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        .pagination button:disabled {
            color: #bbb;
            background: #f5f5f5;
            cursor: not-allowed;
        }

        #pageInfo {
            font-size: 13px;
        }

        /* 오른쪽 지도 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
        }

        /* 작은 화면에 맞게 조정 */
        @media (max-width: 600px) {
            .sidebar {
                width: 45%;
                min-width: 180px;
            }

            .header {
                padding: 14px 10px;
            }

            .header h1 {
                font-size: 17px;
            }

            .header p,
            .tab-button {
                font-size: 12px;
            }

            .place-item {
                padding: 12px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 검색 탭과 장소 목록 -->
        <aside class="sidebar">
            <div class="header">
                <h1>문화 탐방 지도</h1>
                <p>내 주변의 특별한 문화 공간을 찾아보세요!</p>
            </div>

            <div class="tabs">
                <button id="cultureTab" class="tab-button active" type="button">
                    문화 시설
                </button>

                <button id="smallCultureTab" class="tab-button" type="button">
                    소형 문화 공간
                </button>
            </div>

            <div class="location-area">
                <button id="locationButton" type="button">
                    📍 현재 위치로 이동
                </button>
            </div>

            <div class="result-header" id="resultHeader">
                검색 결과
            </div>

            <div id="placeList">
                <div class="message">
                    현재 위치를 확인하고 있어요.
                </div>
            </div>

            <div class="pagination">
                <button id="prevButton" type="button" disabled>
                    이전
                </button>

                <span id="pageInfo">1 페이지</span>

                <button id="nextButton" type="button" disabled>
                    다음
                </button>
            </div>
        </aside>

        <!-- 오른쪽: 지도 -->
        <main id="map"></main>
    </div>

    <script>
        // 지도와 장소 검색에 필요한 변수
        let map;
        let places;
        let currentPosition = null;
        let currentMarker = null;
        let currentInfoWindow = null;

        // 현재 선택된 탭
        let currentTab = "CT1";

        // 검색 결과와 지도 마커 저장
        let markers = [];
        let currentPagination = null;
        let combinedResults = [];
        let currentPage = 1;

        // 검색 결과 한 페이지에 표시할 장소 수
        const pageSize = 15;

        // 두 번째 탭에서 검색할 키워드
        const smallCultureKeywords = [
            "소형 문화시설",
            "소형 공연장",
            "개인 전시관"
        ];

        // 이전 검색 결과가 늦게 도착하는 상황 방지
        let searchRequestId = 0;

        // HTML 요소 가져오기
        const cultureTab = document.getElementById("cultureTab");
        const smallCultureTab = document.getElementById("smallCultureTab");
        const locationButton = document.getElementById("locationButton");
        const placeList = document.getElementById("placeList");
        const resultHeader = document.getElementById("resultHeader");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const pageInfo = document.getElementById("pageInfo");

        // 카카오맵 SDK 로딩이 완료된 후 초기화
        kakao.maps.load(function () {
            initializeMap();
        });

        // 지도 초기화
        function initializeMap() {
            // 위치를 확인하기 전에는 서울시청을 기본 중심으로 사용
            const defaultPosition = new kakao.maps.LatLng(
                37.5665,
                126.9780
            );

            const mapContainer = document.getElementById("map");

            const mapOptions = {
                center: defaultPosition,
                level: 5
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);

            // 장소 검색 서비스 생성
            places = new kakao.maps.services.Places();

            // 탭 버튼 이벤트 연결
            cultureTab.addEventListener("click", function () {
                changeTab("CT1");
            });

            smallCultureTab.addEventListener("click", function () {
                changeTab("SMALL_CULTURE");
            });

            // 현재 위치 버튼 이벤트 연결
            locationButton.addEventListener("click", function () {
                getCurrentLocation(true);
            });

            // 페이지 버튼 이벤트 연결
            prevButton.addEventListener("click", function () {
                changePage(-1);
            });

            nextButton.addEventListener("click", function () {
                changePage(1);
            });

            // 지도가 화면에 배치된 후 현재 위치 확인
            setTimeout(function () {
                map.relayout();
                getCurrentLocation(false);
            }, 100);
        }

        // 현재 위치 확인
        function getCurrentLocation(shouldSearchAgain) {
            if (!navigator.geolocation) {
                showMessage("이 브라우저에서는 위치 기능을 사용할 수 없어요.");
                return;
            }

            locationButton.disabled = true;
            locationButton.textContent = "현재 위치 확인 중...";

            // 브라우저에 위치 권한 요청
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 현재 위치를 지도 중심으로 설정
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    // 이전 현재 위치 마커 제거
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    // 현재 위치 마커 생성
                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: "내 현재 위치"
                    });

                    // 현재 위치 마커 클릭 이벤트
                    kakao.maps.event.addListener(
                        currentMarker,
                        "click",
                        function () {
                            const infoWindow = new kakao.maps.InfoWindow({
                                content:
                                    '<div style="padding:8px;">내 현재 위치</div>'
                            });

                            infoWindow.open(map, currentMarker);
                        }
                    );

                    locationButton.disabled = false;
                    locationButton.textContent = "📍 현재 위치로 이동";

                    // 처음 위치를 확인했거나 버튼을 눌렀으면 주변 검색
                    if (shouldSearchAgain || markers.length === 0) {
                        searchPlaces();
                    }
                },
                function (error) {
                    locationButton.disabled = false;
                    locationButton.textContent = "📍 현재 위치로 이동";

                    let errorMessage = "현재 위치를 확인하지 못했어요.";

                    if (error.code === error.PERMISSION_DENIED) {
                        errorMessage =
                            "위치 권한이 거부되었어요. 브라우저 설정에서 위치 권한을 허용해 주세요.";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        errorMessage = "현재 위치 정보를 사용할 수 없어요.";
                    } else if (error.code === error.TIMEOUT) {
                        errorMessage =
                            "위치 확인 시간이 초과되었어요. 다시 시도해 주세요.";
                    }

                    showMessage(errorMessage);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 탭 변경
        function changeTab(tabName) {
            currentTab = tabName;

            // 선택된 탭의 디자인 변경
            cultureTab.classList.toggle("active", tabName === "CT1");
            smallCultureTab.classList.toggle(
                "active",
                tabName === "SMALL_CULTURE"
            );

            // 기존 검색 결과와 페이지 상태 초기화
            searchRequestId++;
            clearResults();

            if (currentPosition) {
                searchPlaces();
            } else {
                showMessage("현재 위치를 확인하고 있어요.");
            }
        }

        // 선택한 탭에 따라 장소 검색
        function searchPlaces() {
            if (!currentPosition) {
                showMessage("현재 위치를 먼저 확인해 주세요.");
                return;
            }

            // 이번 검색에 고유한 번호 부여
            searchRequestId++;
            const requestId = searchRequestId;

            clearResults();

            resultHeader.textContent =
                currentTab === "CT1"
                    ? "문화 시설 검색 결과"
                    : "소형 문화 공간 검색 결과";

            showMessage("주변 장소를 검색하고 있어요.");

            // 현재 위치 주변 5km를 검색
            const searchOptions = {
                location: currentPosition,
                radius: 5000,
                sort: kakao.maps.services.SortBy.DISTANCE,
                size: 15,
                page: 1
            };

            // 검색 결과가 도착했을 때 이전 검색 결과인지 확인
            function isCurrentRequest() {
                return requestId === searchRequestId;
            }

            // 탭 1: 문화 시설 카테고리 검색
            if (currentTab === "CT1") {
                places.categorySearch(
                    "CT1",
                    function (data, status, pagination) {
                        if (!isCurrentRequest()) {
                            return;
                        }

                        if (status === kakao.maps.services.Status.OK) {
                            currentPagination = pagination;
                            renderPlaces(data);
                            updateCategoryPagination(pagination);
                        } else if (
                            status === kakao.maps.services.Status.ZERO_RESULT
                        ) {
                            showMessage("주변에서 문화 시설을 찾지 못했어요.");
                            updateCategoryPagination(null);
                        } else {
                            showMessage("검색에 실패했어요. 다시 시도해 주세요.");
                            updateCategoryPagination(null);
                        }
                    },
                    searchOptions
                );

            } else {
                // 탭 2: 세 가지 키워드로 각각 검색한 후 결과 통합
                searchSmallCulturePlaces(searchOptions, requestId);
            }
        }

        // 두 번째 탭에서 여러 키워드 검색 결과를 모으기
        function searchSmallCulturePlaces(searchOptions, requestId) {
            let completedSearches = 0;
            let allPlaces = [];

            // 검색어 세 개를 각각 검색
            smallCultureKeywords.forEach(function (keyword) {
                places.keywordSearch(
                    keyword,
                    function (data, status) {
                        // 탭을 바꿨다면 이전 검색은 무시
                        if (requestId !== searchRequestId) {
                            return;
                        }

                        if (status === kakao.maps.services.Status.OK) {
                            allPlaces = allPlaces.concat(data);
                        }

                        completedSearches++;

                        // 세 검색어의 결과가 모두 도착한 후 통합
                        if (
                            completedSearches === smallCultureKeywords.length
                        ) {
                            finishSmallCultureSearch(allPlaces, requestId);
                        }
                    },
                    searchOptions
                );
            });
        }

        // 두 번째 탭의 결과 통합 및 중복 제거
        function finishSmallCultureSearch(data, requestId) {
            if (requestId !== searchRequestId) {
                return;
            }

            const uniquePlaces = [];
            const seenPlaceIds = new Set();

            data.forEach(function (place) {
                // place_id가 같으면 동일 장소로 판단
                const placeId = place.id;

                if (!seenPlaceIds.has(placeId)) {
                    seenPlaceIds.add(placeId);
                    uniquePlaces.push(place);
                }
            });

            // 현재 위치와의 거리가 가까운 순서로 정렬
            uniquePlaces.sort(function (placeA, placeB) {
                const distanceA = getDistance(
                    currentPosition.getLat(),
                    currentPosition.getLng(),
                    Number(placeA.y),
                    Number(placeA.x)
                );

                const distanceB = getDistance(
                    currentPosition.getLat(),
                    currentPosition.getLng(),
                    Number(placeB.y),
                    Number(placeB.x)
                );

                return distanceA - distanceB;
            });

            combinedResults = uniquePlaces;
            currentPage = 1;

            if (combinedResults.length === 0) {
                showMessage(
                    "검색 결과가 없어요. 다른 지역이나 검색어를 시도해 보세요."
                );
                updateCombinedPagination();
                return;
            }

            renderCombinedPage();
        }

        // 두 지점 사이의 거리를 계산하는 함수: 단위는 미터
        function getDistance(lat1, lon1, lat2, lon2) {
            const earthRadius = 6371000;
            const toRadians = function (degrees) {
                return degrees * Math.PI / 180;
            };

            const latDifference = toRadians(lat2 - lat1);
            const lonDifference = toRadians(lon2 - lon1);

            const value =
                Math.sin(latDifference / 2) ** 2 +
                Math.cos(toRadians(lat1)) *
                Math.cos(toRadians(lat2)) *
                Math.sin(lonDifference / 2) ** 2;

            return earthRadius * 2 *
                Math.atan2(Math.sqrt(value), Math.sqrt(1 - value));
        }

        // 통합 검색 결과를 페이지 단위로 표시
        function renderCombinedPage() {
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;

            const pagePlaces = combinedResults.slice(
                startIndex,
                endIndex
            );

            renderPlaces(pagePlaces);
            updateCombinedPagination();
        }

        // 통합 검색 결과에서 이전/다음 페이지로 이동
        function changePage(direction) {
            if (currentTab === "SMALL_CULTURE") {
                const totalPages = Math.ceil(
                    combinedResults.length / pageSize
                );

                const nextPage = currentPage + direction;

                if (nextPage >= 1 && nextPage <= totalPages) {
                    currentPage = nextPage;
                    renderCombinedPage();
                }
            } else if (currentPagination) {
                // 카테고리 검색은 카카오맵에서 제공하는 페이지 이동 사용
                if (direction === -1 && currentPagination.hasPrevPage) {
                    currentPagination.prevPage();
                } else if (
                    direction === 1 &&
                    currentPagination.hasNextPage
                ) {
                    currentPagination.nextPage();
                }
            }
        }

        // 장소 목록과 지도 마커 표시
        function renderPlaces(data) {
            clearPlaceItems();

            resultHeader.textContent =
                "검색 결과 " + data.length + "개";

            if (data.length === 0) {
                showMessage("검색 결과가 없어요.");
                return;
            }

            data.forEach(function (place) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                // 지도에 장소 마커 생성
                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: place.place_name
                });

                markers.push(marker);

                // 마커를 클릭하면 장소 이름과 주소 표시
                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        showPlaceInfo(marker, place);
                    }
                );

                // 왼쪽 장소 목록 항목 생성
                const placeItem = document.createElement("div");
                placeItem.className = "place-item";

                const placeName = document.createElement("div");
                placeName.className = "place-name";
                placeName.textContent = place.place_name;

                const placeAddress = document.createElement("div");
                placeAddress.className = "place-address";
                placeAddress.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                placeItem.appendChild(placeName);
                placeItem.appendChild(placeAddress);

                // 목록을 누르면 지도에서 해당 장소로 이동
                placeItem.addEventListener("click", function () {
                    map.panTo(position);
                    showPlaceInfo(marker, place);
                });

                placeList.appendChild(placeItem);
            });
        }

        // 마커를 클릭했을 때 이름과 주소를 팝업으로 표시
        function showPlaceInfo(marker, place) {
            if (currentInfoWindow) {
                currentInfoWindow.close();
            }

            const address =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            // 장소 정보를 HTML 요소로 만들어 안전하게 표시
            const content = document.createElement("div");
            content.style.cssText =
                "padding:10px; min-width:150px; max-width:240px;" +
                "font-size:13px; line-height:1.5;";

            const nameElement = document.createElement("strong");
            nameElement.textContent = place.place_name;

            const addressElement = document.createElement("div");
            addressElement.textContent = address;
            addressElement.style.marginTop = "5px";

            content.appendChild(nameElement);
            content.appendChild(addressElement);

            currentInfoWindow = new kakao.maps.InfoWindow({
                content: content
            });

            currentInfoWindow.open(map, marker);
        }

        // 검색 결과의 마커와 목록만 제거
        function clearPlaceItems() {
            markers.forEach(function (marker) {
                marker.setMap(null);
            });

            markers = [];
            placeList.innerHTML = "";

            if (currentInfoWindow) {
                currentInfoWindow.close();
                currentInfoWindow = null;
            }
        }

        // 검색 결과 전체 초기화
        function clearResults() {
            clearPlaceItems();

            currentPagination = null;
            combinedResults = [];
            currentPage = 1;

            pageInfo.textContent = "1 페이지";
            prevButton.disabled = true;
            nextButton.disabled = true;
        }

        // 카테고리 검색 페이지 버튼 갱신
        function updateCategoryPagination(pagination) {
            currentPagination = pagination;

            if (!pagination) {
                pageInfo.textContent = "1 페이지";
                prevButton.disabled = true;
                nextButton.disabled = true;
                return;
            }

            pageInfo.textContent = pagination.current + " 페이지";
            prevButton.disabled = !pagination.hasPrevPage;
            nextButton.disabled = !pagination.hasNextPage;
        }

        // 여러 키워드를 합친 검색 결과의 페이지 버튼 갱신
        function updateCombinedPagination() {
            const totalPages = Math.ceil(
                combinedResults.length / pageSize
            );

            pageInfo.textContent =
                currentPage + " / " + Math.max(totalPages, 1) + " 페이지";

            prevButton.disabled = currentPage <= 1;
            nextButton.disabled =
                totalPages === 0 || currentPage >= totalPages;
        }

        // 안내 문구 표시
        function showMessage(message) {
            placeList.innerHTML = "";

            const messageElement = document.createElement("div");
            messageElement.className = "message";
            messageElement.textContent = message;

            placeList.appendChild(messageElement);
        }
    </script>
</body>
</html>
