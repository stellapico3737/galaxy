
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문화 탐방 지도</title>

    <style>
        /* 기본 페이지 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽 탐색 영역과 오른쪽 지도 영역으로 분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 탐색 패널 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            padding: 22px;
            background: #fff;
            border-right: 1px solid #ddd;
            z-index: 2;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            margin: 0 0 18px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 문화 시설과 관광 시설 탭 */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 6px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f5f5f5;
            color: #444;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-button.active {
            background: #fee500;
            border-color: #e5ce00;
            color: #222;
        }

        .tab-button:hover {
            filter: brightness(0.97);
        }

        /* 상태 안내 문구 */
        #status {
            margin-bottom: 12px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 검색 결과 목록 */
        #resultList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .place-item {
            padding: 14px 8px;
            border-bottom: 1px solid #eee;
            border-radius: 6px;
            cursor: pointer;
        }

        .place-item:hover,
        .place-item.selected {
            background: #fffbea;
        }

        .place-name {
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-address {
            margin-bottom: 6px;
            color: #555;
            font-size: 12px;
            line-height: 1.6;
        }

        .place-category {
            color: #888;
            font-size: 11px;
            line-height: 1.5;
        }

        .place-phone {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
        }

        /* 오른쪽 지도와 로드뷰 영역 */
        .map-area {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #eee;
        }

        #mapCanvas,
        #roadviewCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #roadviewCanvas {
            display: none;
        }

        /* 로드뷰 버튼 */
        .map-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
        }

        .control-button {
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px #00000018;
        }

        .control-button:hover {
            background: #fffbea;
        }

        /* 모바일에서는 위아래로 배치 */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 45%;
                min-height: 270px;
                padding: 14px;
            }

            h1 {
                font-size: 20px;
            }

            .map-area {
                width: 100%;
                height: 55%;
                min-height: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 문화 탐방 탭과 장소 목록 -->
        <aside class="sidebar">
            <h1>📍 문화 탐방 지도</h1>

            <p class="description">
                내 주변의 문화 공간과 관광 명소를 탐색해 보세요.
            </p>

            <!-- 탭을 누르면 해당 카테고리의 장소를 검색 -->
            <div class="tab-container" role="group" aria-label="장소 종류">
                <button
                    id="cultureTab"
                    class="tab-button active"
                    type="button"
                    aria-pressed="true"
                >
                    문화 시설
                </button>

                <button
                    id="tourTab"
                    class="tab-button"
                    type="button"
                    aria-pressed="false"
                >
                    관광 시설
                </button>
            </div>

            <div id="status" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </div>

            <div id="resultList"></div>
        </aside>

        <!-- 오른쪽: 지도와 로드뷰 -->
        <main class="map-area">
            <div id="mapCanvas" aria-label="문화 탐방 지도"></div>
            <div id="roadviewCanvas" aria-label="선택한 장소의 로드뷰"></div>

            <!-- 지도와 로드뷰 전환 버튼 -->
            <div class="map-controls">
                <button
                    id="roadviewButton"
                    class="control-button"
                    type="button"
                >
                    로드뷰 보기
                </button>
            </div>
        </main>

    </div>

    <!-- 카카오 지도 SDK: 장소 검색과 마커 군집화 라이브러리 포함 -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0156c394d790a54991f25ec6156f1d8f&libraries=services,clusterer&autoload=false"
        onerror="document.getElementById('status').textContent='지도 SDK를 불러오지 못했습니다. 키와 도메인 설정을 확인하세요.'"
    ></script>

    <script>
        // 지도와 검색 기능에 사용할 변수
        let map = null;
        let places = null;
        let clusterer = null;
        let roadview = null;
        let roadviewClient = null;
        let infoWindow = null;

        let currentPosition = null;
        let currentMarker = null;
        let placeMarkers = [];
        let selectedPlace = null;

        // 현재 선택한 카테고리: CT1은 문화 시설, AT4는 관광 명소
        let currentCategory = "CT1";

        // 지도와 위치 기능의 준비 상태
        let isMapReady = false;

        // HTML 요소 가져오기
        const cultureTab = document.getElementById("cultureTab");
        const tourTab = document.getElementById("tourTab");
        const statusElement = document.getElementById("status");
        const resultList = document.getElementById("resultList");
        const roadviewButton = document.getElementById("roadviewButton");
        const mapCanvas = document.getElementById("mapCanvas");
        const roadviewCanvas = document.getElementById("roadviewCanvas");

        // 상태 안내 문구 변경
        function setStatus(message) {
            statusElement.textContent = message;
        }

        // 카카오 지도 SDK가 준비된 뒤 초기화
        function loadKakaoMap() {
            if (!window.kakao || !window.kakao.maps) {
                setStatus("SDK 로드에 실패했습니다. JavaScript 키와 등록 도메인을 확인하세요.");
                return;
            }

            kakao.maps.load(function () {
                initializeMap();
            });
        }

        // 지도와 주변 장소 검색 기능 초기화
        function initializeMap() {
            // 위치를 가져오지 못했을 때 사용할 기본 위치: 서울 시청
            const defaultPosition = new kakao.maps.LatLng(
                37.5665,
                126.9780
            );

            // 지도를 확대 레벨 5로 생성
            map = new kakao.maps.Map(mapCanvas, {
                center: defaultPosition,
                level: 5
            });

            // 카테고리 검색과 정보창 생성
            places = new kakao.maps.services.Places();

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 10
            });

            // 마커 군집화 객체 생성
            if (kakao.maps.MarkerClusterer) {
                clusterer = new kakao.maps.MarkerClusterer({
                    map: map,
                    averageCenter: true,
                    minLevel: 6
                });
            }

            // 로드뷰와 로드뷰 파노라마 검색 객체 생성
            roadview = new kakao.maps.Roadview(roadviewCanvas);
            roadviewClient = new kakao.maps.RoadviewClient();

            // 지도 객체가 생성된 뒤 검색 기능 활성화
            isMapReady = true;
            setStatus("현재 위치를 확인하고 있습니다.");

            // 브라우저의 위치 권한 요청
            if (!navigator.geolocation) {
                currentPosition = defaultPosition;
                setStatus("위치 기능을 지원하지 않아 기본 위치에서 검색합니다.");
                searchNearbyPlaces();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도 저장
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    // 지도 중심을 현재 위치로 이동
                    map.setCenter(currentPosition);

                    // 현재 위치를 나타내는 마커 표시
                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: "현재 위치"
                    });

                    setStatus("현재 위치를 확인했습니다. 주변 장소를 검색합니다.");

                    // 위치 확인이 끝나면 현재 선택된 탭의 장소 검색
                    searchNearbyPlaces();
                },
                function (error) {
                    // 위치 확인에 실패하면 기본 위치를 사용
                    currentPosition = defaultPosition;

                    if (error.code === error.PERMISSION_DENIED) {
                        setStatus("위치 권한이 거부되어 기본 위치에서 검색합니다.");
                    } else if (error.code === error.TIMEOUT) {
                        setStatus("위치 확인 시간이 초과되어 기본 위치에서 검색합니다.");
                    } else {
                        setStatus("현재 위치를 확인하지 못해 기본 위치에서 검색합니다.");
                    }

                    // 기본 위치를 중심으로 검색 실행
                    searchNearbyPlaces();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 탭의 선택 상태를 화면에 반영
        function updateTabButtons() {
            const isCulture = currentCategory === "CT1";

            cultureTab.classList.toggle("active", isCulture);
            tourTab.classList.toggle("active", !isCulture);

            cultureTab.setAttribute("aria-pressed", String(isCulture));
            tourTab.setAttribute("aria-pressed", String(!isCulture));
        }

        // 기존 검색 결과와 마커를 모두 제거
        function clearResults() {
            resultList.replaceChildren();

            // 기존 정보창 닫기
            if (infoWindow) {
                infoWindow.close();
            }

            // 군집화 객체에서 기존 마커 제거
            if (clusterer) {
                clusterer.clear();
            }

            // 지도에 직접 표시된 마커도 제거
            placeMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            placeMarkers = [];
            selectedPlace = null;

            // 현재 위치 마커는 검색 결과 마커가 아니므로 유지
        }

        // 문화 시설 또는 관광 명소를 현재 위치 주변에서 검색
        function searchNearbyPlaces() {
            if (!isMapReady || !places || !currentPosition) {
                return;
            }

            clearResults();

            const categoryName =
                currentCategory === "CT1" ? "문화 시설" : "관광 시설";

            setStatus(categoryName + " 주변 장소를 검색하고 있습니다...");

            // 현재 위치를 기준으로 반경 5km 이내의 장소 검색
            places.categorySearch(
                currentCategory,
                function (data, status, pagination) {
                    if (status === kakao.maps.services.Status.OK) {
                        displayPlaces(data);
                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        setStatus("주변에 검색된 " + categoryName + "이(가) 없습니다.");
                    } else {
                        setStatus("검색 중 오류가 발생했습니다. 다시 시도해 주세요.");
                    }
                },
                {
                    location: currentPosition,
                    radius: 5000,
                    sort: kakao.maps.services.SortBy.DISTANCE,
                    size: 15
                }
            );
        }

        // 장소 정보창에 이름과 주소 표시
        function showPlaceInfo(place, marker) {
            const content = document.createElement("div");

            content.style.cssText =
                "padding:12px;max-width:250px;line-height:1.6;" +
                "font-size:12px;overflow-wrap:anywhere;";

            const name = document.createElement("strong");
            name.textContent = place.place_name;

            const address = document.createElement("div");
            address.style.marginTop = "5px";
            address.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            content.append(name, address);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);

            selectedPlace = place;
        }

        // 장소 하나의 지도 마커 생성
        function createPlaceMarker(place) {
            const position = new kakao.maps.LatLng(
                Number(place.y),
                Number(place.x)
            );

            const marker = new kakao.maps.Marker({
                position: position,
                title: place.place_name
            });

            // 마커를 누르면 장소 이름과 주소 표시
            kakao.maps.event.addListener(marker, "click", function () {
                showPlaceInfo(place, marker);
                highlightPlace(place);
            });

            placeMarkers.push(marker);

            return marker;
        }

        // 선택한 장소의 목록 항목 강조
        function highlightPlace(place) {
            const items = resultList.querySelectorAll(".place-item");

            items.forEach(function (item) {
                const isSelected =
                    item.dataset.placeId === place.id;

                item.classList.toggle("selected", isSelected);
            });
        }

        // 검색 결과를 목록과 지도에 표시
        function displayPlaces(data) {
            clearResults();

            if (!data || data.length === 0) {
                setStatus("검색 결과가 없습니다.");
                return;
            }

            setStatus("주변 장소 " + data.length + "개를 찾았습니다.");

            // 검색 결과마다 목록 항목과 마커 생성
            data.forEach(function (place) {
                const item = document.createElement("div");
                item.className = "place-item";
                item.dataset.placeId = place.id;

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = place.place_name;

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                const category = document.createElement("div");
                category.className = "place-category";
                category.textContent =
                    place.category_name || "분류 정보 없음";

                item.append(name, address, category);

                // 전화번호가 제공되는 경우에만 표시
                if (place.phone) {
                    const phone = document.createElement("div");
                    phone.className = "place-phone";
                    phone.textContent = place.phone;
                    item.appendChild(phone);
                }

                // 목록을 클릭하면 지도를 이동하고 정보창 표시
                item.addEventListener("click", function () {
                    const position = new kakao.maps.LatLng(
                        Number(place.y),
                        Number(place.x)
                    );

                    map.setCenter(position);
                    map.setLevel(3);

                    // 군집화 여부와 관계없이 해당 장소의 정보창 표시
                    const marker = placeMarkers.find(function (itemMarker) {
                        return itemMarker.getTitle() === place.place_name;
                    });

                    if (marker) {
                        showPlaceInfo(place, marker);
                    }

                    highlightPlace(place);
                    selectedPlace = place;
                });

                resultList.appendChild(item);
            });

            // 모든 검색 결과에 해당하는 마커 생성
            data.forEach(function (place) {
                createPlaceMarker(place);
            });

            // 군집화 기능이 있으면 마커들을 군집으로 표시
            if (clusterer) {
                clusterer.addMarkers(placeMarkers);
            } else {
                // 군집화 라이브러리를 사용할 수 없으면 개별 마커 표시
                placeMarkers.forEach(function (marker) {
                    marker.setMap(map);
                });
            }

            // 검색 결과가 보이도록 지도 범위 조정
            const bounds = new kakao.maps.LatLngBounds();

            bounds.extend(currentPosition);

            data.forEach(function (place) {
                bounds.extend(
                    new kakao.maps.LatLng(
                        Number(place.y),
                        Number(place.x)
                    )
                );
            });

            map.setBounds(bounds);
        }

        // 선택한 장소의 로드뷰 표시
        function showRoadview() {
            if (!isMapReady || !roadviewClient) {
                setStatus("로드뷰가 아직 준비되지 않았습니다.");
                return;
            }

            if (!selectedPlace) {
                setStatus("먼저 목록이나 지도에서 장소를 선택해 주세요.");
                return;
            }

            const position = new kakao.maps.LatLng(
                Number(selectedPlace.y),
                Number(selectedPlace.x)
            );

            setStatus("주변 로드뷰 정보를 확인하고 있습니다...");

            // 선택한 장소에서 가까운 로드뷰 파노라마 검색
            roadviewClient.getNearestPanoId(
                position,
                100,
                function (panoId) {
                    if (!panoId) {
                        setStatus("이 장소 주변에는 이용 가능한 로드뷰가 없습니다.");
                        return;
                    }

                    // 검색된 파노라마를 로드뷰에 표시
                    roadviewCanvas.style.display = "block";
                    mapCanvas.style.display = "none";

                    roadview.setPanoId(panoId, position);

                    roadviewButton.textContent = "지도 돌아가기";

                    setStatus("로드뷰를 표시하고 있습니다.");
                }
            );
        }

        // 로드뷰를 닫고 지도 화면으로 돌아가기
        function showMap() {
            roadviewCanvas.style.display = "none";
            mapCanvas.style.display = "block";

            roadviewButton.textContent = "로드뷰 보기";

            // 다시 보이는 지도의 크기와 중심을 갱신
            if (map) {
                map.relayout();

                if (selectedPlace) {
                    map.setCenter(
                        new kakao.maps.LatLng(
                            Number(selectedPlace.y),
                            Number(selectedPlace.x)
                        )
                    );
                }
            }
        }

        // 문화 시설 탭을 누르면 CT1 검색
        cultureTab.addEventListener("click", function () {
            currentCategory = "CT1";
            updateTabButtons();
            showMap();
            searchNearbyPlaces();
        });

        // 관광 시설 탭을 누르면 AT4 검색
        tourTab.addEventListener("click", function () {
            currentCategory = "AT4";
            updateTabButtons();
            showMap();
            searchNearbyPlaces();
        });

        // 로드뷰 버튼을 누르면 지도와 로드뷰 전환
        roadviewButton.addEventListener("click", function () {
            if (roadviewCanvas.style.display === "block") {
                showMap();
            } else {
                showRoadview();
            }
        });

        // 카카오 지도 SDK가 준비되면 지도 초기화 시작
        loadKakaoMap();
    </script>
</body>
</html>
